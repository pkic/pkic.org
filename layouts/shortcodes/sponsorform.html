<div data-sponsor-inquiry data-module="member-flows/sponsor-form">
  <div data-flow-status class="alert visually-hidden" role="alert" aria-live="polite"></div>

  <form id="inputForm" class="row g-3 my-2 needs-validation" novalidate>
    <div class="col-lg-6">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" class="form-control" id="firstName" name="firstName" required />
    </div>
    <div class="col-lg-6">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="lastName" name="lastName" required />
      <div data-field-error="contactName" class="invalid-feedback d-block"></div>
    </div>
    <div class="col-12">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" required />
      <div data-field-error="contactEmail" class="invalid-feedback d-block"></div>
    </div>
    <div class="col-12">
      <label for="organizationName" class="form-label">Organization Name</label>
      <input type="text" class="form-control" id="organizationName" name="organizationName" required />
      <div data-field-error="organizationName" class="invalid-feedback d-block"></div>
    </div>
    <div class="col-12">
      <label for="organizationWebsite" class="form-label">Website</label>
      <input type="url" class="form-control" id="organizationWebsite" name="organizationWebsite" placeholder="https://" />
      <div data-field-error="organizationWebsite" class="invalid-feedback d-block"></div>
    </div>

    <div class="col-12">
      <label for="desiredTier" class="form-label">How would you like to sponsor?</label>
      <select id="desiredTier" class="form-select" name="desiredTier" required>
        <option value="" selected disabled>Select how you would like to sponsor</option>
        <option value="Diamond">We would like to become a Diamond sponsor</option>
        <option value="Titanium">We would like to become a Titanium sponsor</option>
        <option value="Platinum">We would like to become a Platinum sponsor</option>
        <option value="Gold">We would like to become a Gold sponsor</option>
        <option value="Silver">We would like to become a Silver sponsor</option>
        <option value="Bronze">We would like to become a Bronze sponsor</option>
        <option value="Donation">We would like to make a donation</option>
        <option value="To be decided">We would like to decide later</option>
        <option value="Other">Other (specify below)</option>
      </select>
      <div data-field-error="desiredTier" class="invalid-feedback d-block"></div>
    </div>

    <div class="col-12">
      <div class="mb-3">
        <label for="comments" class="form-label">Comments</label>
        <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
      </div>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-success">Submit your interest to sponsor the PKI Consortium</button>
    </div>
  </form>
</div>
