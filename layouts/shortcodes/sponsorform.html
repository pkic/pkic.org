<div class="pk" data-sponsor-inquiry data-module="member-flows/sponsor-form">
  <div data-flow-status class="pk-alert pk-sr-only" role="alert" aria-live="polite"></div>

  <form id="inputForm" class="pk-stack needs-validation" novalidate>
    <div class="pk-grid">
      <div class="pk-field">
        <label for="firstName" class="pk-field__label">First Name</label>
        <input type="text" class="pk-input" id="firstName" name="firstName" autocomplete="given-name" required />
      </div>
      <div class="pk-field">
        <label for="lastName" class="pk-field__label">Last Name</label>
        <input type="text" class="pk-input" id="lastName" name="lastName" autocomplete="family-name" required />
        <div data-field-error="contactName" class="pk-field__message"></div>
      </div>
    </div>

    <div class="pk-field">
      <label for="email" class="pk-field__label">Email</label>
      <input type="email" class="pk-input" id="email" name="email" autocomplete="email" required />
      <div data-field-error="contactEmail" class="pk-field__message"></div>
    </div>

    <div class="pk-field">
      <label for="organizationName" class="pk-field__label">Organization Name</label>
      <input
        type="text"
        class="pk-input"
        id="organizationName"
        name="organizationName"
        autocomplete="organization"
        required
      />
      <div data-field-error="organizationName" class="pk-field__message"></div>
    </div>

    <div class="pk-field">
      <label for="organizationWebsite" class="pk-field__label">Website</label>
      <input
        type="url"
        class="pk-input"
        id="organizationWebsite"
        name="organizationWebsite"
        autocomplete="url"
        placeholder="https://"
      />
      <div data-field-error="organizationWebsite" class="pk-field__message"></div>
    </div>

    <div class="pk-field">
      <label for="tier" class="pk-field__label">How would you like to sponsor?</label>
      <select id="tier" class="pk-input pk-input--select" name="tier" aria-describedby="tierHelp" required disabled>
        <option value="" selected disabled>Loading sponsorship options…</option>
      </select>
      <div id="tierHelp" class="pk-field__help">
        Not sure which option is right for you? Choose the contact option and we will help.
      </div>
      <div data-field-error="tier" class="pk-field__message"></div>
    </div>

    <div class="pk-field">
      <label for="comments" class="pk-field__label">Comments</label>
      <textarea class="pk-input pk-input--textarea" id="comments" name="comments" rows="3"></textarea>
    </div>

    <div class="pk-cluster">
      <button type="submit" class="pk-btn pk-btn--primary">Submit your interest to sponsor the PKI Consortium</button>
    </div>
  </form>
</div>
