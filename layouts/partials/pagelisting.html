<p>
    <strong><a href="{{ .RelPermalink }}" title="{{ .Title }}">{{ .Title }}</a></strong>
    {{ with .Params.authors }}
    {{ $customDateFormat := "January 2, 2006" }}
    {{ with $.Site.Params.customDateFormat }}{{ $customDateFormat = . }}{{ end }}
    <br>
    <small class="pk-small pk-break">{{ $.PublishDate.Format $customDateFormat }} by {{ partial "authors.html" $ }}
    {{ partial "tags" $.Params.tags }}</small>
    {{end}}
    <br>
    {{ .Summary }}
</p>
