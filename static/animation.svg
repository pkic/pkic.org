<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" style="background: #1a1a1a;">
    <style>
        .shp0 { fill: white; }
        
        /* The emblem acts as the wheel; it is drawn around the canvas center (300, 300), its exact rotation center. */
        #VaultWheel {
            transform-box: view-box;
            transform-origin: 300px 300px;
            animation: 
                wheelAppear 1.5s ease-out forwards,
                wheelRotate 1.5s cubic-bezier(0.45, 0, 0.55, 1) 3s forwards;
        }

        /* The "Door" elements */
        #DoorRight {
            animation: openDoor 2s ease-in-out 4.5s forwards;
        }

        /* 1. Logo parts flying together */
        @keyframes wheelAppear {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 2. The Table turning like a Vault Handle */
        @keyframes wheelRotate {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-15deg); } /* Slight recoil/tension */
            100% { transform: rotate(90deg); }
        }

        /* 3. The Door sliding open */
        @keyframes openDoor {
            0% { transform: translateX(0); }
            100% { transform: translateX(400px); }
        }

        /* 4. Individual piece entry (Building the logo) */
        #Left { animation: joinL 1s ease-out 0.2s both; }
        #Right { animation: joinR 1s ease-out 0.4s both; }
        #Bottom { animation: joinB 1s ease-out 0.6s both; }
        #Keyhole { animation: keyFlash 0.5s ease-in-out 2.5s 2; }

        @keyframes joinL { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes joinR { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes joinB { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        @keyframes keyFlash {
            0%, 100% { fill: white; filter: drop-shadow(0 0 0px #4fc3f7); }
            50% { fill: #4fc3f7; filter: drop-shadow(0 0 15px #4fc3f7); }
        }

        /* Background Glow (The 'Secret' inside the vault) */
        #VaultInside {
            fill: #0d47a1;
            opacity: 0;
            animation: fadeIn 1s ease-in 4.5s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>

    <rect id="VaultInside" x="0" y="0" width="600" height="600" />
    <text x="300" y="310" text-anchor="middle" fill="#4fc3f7" font-family="sans-serif" font-weight="bold" font-size="24" style="opacity:0; animation: fadeIn 1s forwards 5s;">TRUST ESTABLISHED</text>

    <g id="DoorRight">
        <rect x="0" y="0" width="600" height="600" fill="#333" />
        
        <g id="VaultWheel">
            <path id="Table" class="shp0" d="M309.905 201.165A99.33 99.33 0 0 1 390.546 340.839L431.47 364.467L421.565 381.623L380.641 357.995A99.33 99.33 0 0 1 219.359 357.995L178.435 381.623L168.53 364.467L209.454 340.839A99.33 99.33 0 0 1 290.095 201.165L290.095 153.91L309.905 153.91ZM300 220.48A79.52 79.52 0 0 0 300 379.52A79.52 79.52 0 0 0 300 220.48Z" />
            <path id="Keyhole" class="shp0" d="M289.025 295.7L275.295 348.84L324.705 348.84L310.975 295.7A23.625 23.625 0 1 0 289.025 295.7Z" />
            <path id="Bottom" class="shp0" d="M328.803 443.222C320.41 457.77 318.765 477.85 300 477.85C281.235 477.85 279.59 457.77 271.197 443.222A146.09 146.09 0 0 1 198.134 404.717L212.552 391.088A126.27 126.27 0 0 0 387.448 391.088L401.866 404.717A146.09 146.09 0 0 1 328.803 443.222Z" />
            <path id="Right" class="shp0" d="M409.632 203.444C426.428 203.439 444.64 194.824 454.023 211.075C463.405 227.326 446.838 238.791 438.436 253.333A146.09 146.09 0 0 1 441.62 335.86L422.608 330.188A126.27 126.27 0 0 0 335.161 178.724L339.754 159.423A146.09 146.09 0 0 1 409.632 203.444Z" />
            <path id="Left" class="shp0" d="M161.564 253.333C153.162 238.791 136.595 227.326 145.977 211.075C155.36 194.824 173.572 203.439 190.368 203.444A146.09 146.09 0 0 1 260.246 159.423L264.839 178.724A126.27 126.27 0 0 0 177.392 330.188L158.38 335.86A146.09 146.09 0 0 1 161.564 253.333Z" />
        </g>
    </g>
</svg>