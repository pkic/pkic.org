# Content paths excluded from site publication.
ignoreFiles:
  - "/(archetypes|assets|content|data|i18n|layouts|static)/([^/]+/)*\\." # Hidden files/folders inside the site
  - "(^|/)(AGENTS|CLAUDE|CODEX|COPILOT|GEMINI|PROMPTS)\\.md$" # Matches exact instruction files anywhere
  - wg/pkimm/(extensions|integrations)/pkimm-model/
  - wg/pkimm/(extensions|integrations)/scripts/
  - wg/pkimm/(extensions|integrations)/\.github/


# Shared public-site navigation.
menu:
  footer:
    # Column headers — children register themselves via each page's frontmatter
    - identifier: consortium
      name: Consortium
      weight: 10
    - identifier: governance
      name: Governance
      weight: 20
    - identifier: resources
      name: Resources
      weight: 30
    # External link with no content page
    - name: Discussions
      url: https://github.com/orgs/pkic/discussions
      parent: resources
      weight: 35
      params:
        external: true
