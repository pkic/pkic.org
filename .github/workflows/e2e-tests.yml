name: E2E Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.ts"
      - "layouts/**"
      - "functions/**"
      - "config.yaml"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "wrangler.jsonc"
      - ".github/workflows/e2e-tests.yml"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "layouts/**"
      - "functions/**"
      - "config.yaml"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "wrangler.jsonc"
      - ".github/workflows/e2e-tests.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Each shard starts its own Worker and runs about a third of the suite.
    # The Worker this harness runs has been seen to die part-way through a long
    # run, and every test after it then fails against a dead server — so a
    # single run reports dozens of failures whose cause is one line near the
    # top. Sharding bounds that: a death takes one shard rather than the suite,
    # the other two still report, and each server lives a third as long.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          extended: true
          hugo-version: "0.161.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare dev vars
        run: cp .dev.vars.example .dev.vars

      - name: Run e2e checks
        id: e2e
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7