name: Application Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.astro"
      - "**/*.scss"
      - "**/*.css"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "static/**"
      - "config.yaml"
      - ".dev.vars.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config*.ts"
      - "wrangler.jsonc"
      - ".github/workflows/backend-tests.yml"
      - ".github/actions/setup-validation/**"
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.astro"
      - "**/*.scss"
      - "**/*.css"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "static/**"
      - "config.yaml"
      - ".dev.vars.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config*.ts"
      - "wrangler.jsonc"
      - ".github/workflows/backend-tests.yml"
      - ".github/actions/setup-validation/**"

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Static and Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup-validation

      - name: Run static checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run check:static

      - name: Run schema and policy unit tests (Node)
        timeout-minutes: 2
        run: pnpm run test:unit --bail=1

  frontend-tools:
    name: Frontend and tooling checks
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/setup-validation

      - name: Run frontend component tests
        timeout-minutes: 5
        run: pnpm run test:frontend --bail=1

      - name: Run tooling tests
        timeout-minutes: 5
        run: pnpm run test:tools --bail=1

  browser:
    name: Critical browser journeys
    needs: preflight
    runs-on: ubuntu-latest
    # Match the locked Playwright version; avoid per-run apt downloads of browser dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-validation
        id: validation-setup
        with:
          publication-cache: "true"

      - name: Generate the public site
        timeout-minutes: 5
        run: pnpm run generate:public

      - name: Check the CSS budget
        timeout-minutes: 2
        run: pnpm run check:css-budget

      - name: Prepare dev vars
        run: cp .dev.vars.example .dev.vars

      # Build and publication have their own deadline; the browser server's
      # startup deadline measures serving readiness rather than image encoding.
      # Cold publication plus isolated fixture setup and release assembly can exceed ten minutes.
      - name: Prepare browser test publication
        timeout-minutes: 15
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/pkic-e2e.XXXXXX")
          trap 'rm -rf "$state_dir"' EXIT
          sh scripts/e2e-prepare.sh "$state_dir"
          echo "E2E_STATE_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "E2E_PREPARED_STATE_DIR=$state_dir" >> "$GITHUB_ENV"
          trap - EXIT

      # Preserve completed compiler work even if a later browser test fails.
      - name: Save publication compiler cache
        if: steps.validation-setup.outputs.publication-cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules/.astro/publication/local/assets
            node_modules/.astro/publication/local/publication-transform-cache.json
            node_modules/.astro/publication/local/publication-social
            node_modules/.astro/publication/local/publication-diagrams
            node_modules/.astro/publication/local/publication-browser
          key: ${{ steps.validation-setup.outputs.publication-cache-key }}

      # One Playwright invocation reuses the synthetic release and database.
      # maxFailures still stops after the first persistent journey failure.
      - name: Run critical browser user journeys
        timeout-minutes: 5
        run: pnpm run test:e2e:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  worker:
    name: Worker integration (${{ matrix.project }} ${{ matrix.shard }})
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { project: d1, shard: "1/4", artifact: d1-1 }
          - { project: d1, shard: "2/4", artifact: d1-2 }
          - { project: d1, shard: "3/4", artifact: d1-3 }
          - { project: d1, shard: "4/4", artifact: d1-4 }
          - { project: worker-fetch, shard: "1/1", artifact: worker-fetch }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-validation
        with:
          publication-cache: ${{ matrix.project == 'worker-fetch' }}
      - name: Run Worker and D1 integration tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PKIC_TEST_PROFILE_PATH: ${{ runner.temp }}/worker-profile.json
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/worker-resources.txt" \
            pnpm run test:worker --project ${{ matrix.project }} --shard=${{ matrix.shard }} --bail=1
      - name: Upload Worker timing profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-profile-${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/worker-profile.json
            ${{ runner.temp }}/worker-resources.txt
            ${{ runner.temp }}/validation-host.json
          if-no-files-found: warn
          retention-days: 7

  application:
    # Preserve the existing required-check name during the job split.
    name: Application checks (fail-fast sequence)
    needs: [preflight, frontend-tools, browser, worker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = Object.values(JSON.parse(process.env.RESULTS));
            if (jobs.some(job => job.result !== "success")) process.exit(1);
          '
