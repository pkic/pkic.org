name: Application Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.astro"
      - "**/*.scss"
      - "**/*.css"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "static/**"
      - "config.yaml"
      - ".dev.vars.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config*.ts"
      - "wrangler.jsonc"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.astro"
      - "**/*.scss"
      - "**/*.css"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "static/**"
      - "config.yaml"
      - ".dev.vars.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config*.ts"
      - "wrangler.jsonc"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { suite: site, name: Site and browser checks }
          - { suite: worker, name: Worker and D1 (1/3), shard: 1/3 }
          - { suite: worker, name: Worker and D1 (2/3), shard: 2/3 }
          - { suite: worker, name: Worker and D1 (3/3), shard: 3/3 }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        if: matrix.suite == 'site'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run check:static

      - name: Run schema and policy unit tests (Node)
        if: matrix.suite == 'site'
        timeout-minutes: 2
        run: pnpm run test:unit --bail=1

      - name: Run frontend component tests
        if: matrix.suite == 'site'
        timeout-minutes: 5
        run: pnpm run test:frontend --bail=1

      - name: Run tooling tests
        if: matrix.suite == 'site'
        timeout-minutes: 5
        run: pnpm run test:tools --bail=1

      - name: Generate the public site
        if: matrix.suite == 'site'
        timeout-minutes: 5
        run: pnpm run generate:public

      - name: Check the CSS budget
        if: matrix.suite == 'site'
        timeout-minutes: 2
        run: pnpm run check:css-budget

      - name: Install Playwright browser
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare dev vars
        run: cp .dev.vars.example .dev.vars

      # Each compiler keys derivatives by source bytes and rendering policy.
      # Restore only generated media and the versioned rootless renderer;
      # fresh D1 state, snapshots, HTML, and release manifests are never cached.
      - name: Restore publication compiler cache
        id: publication-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules/.astro/publication/local/assets
            node_modules/.astro/publication/local/publication-social
            node_modules/.astro/publication/local/publication-diagrams
            node_modules/.astro/publication/local/publication-browser
          key: publication-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            publication-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Build and publication have their own deadline; the browser server's
      # startup deadline measures serving readiness rather than image encoding.
      # Cold publication plus isolated fixture setup and release assembly can exceed ten minutes.
      - name: Prepare browser test publication
        if: matrix.suite == 'site'
        timeout-minutes: 15
        run: |
          state_dir=$(mktemp -d "$RUNNER_TEMP/pkic-e2e.XXXXXX")
          trap 'rm -rf "$state_dir"' EXIT
          sh scripts/e2e-prepare.sh "$state_dir"
          echo "E2E_STATE_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "E2E_PREPARED_STATE_DIR=$state_dir" >> "$GITHUB_ENV"
          trap - EXIT

      # Preserve completed compiler work even if a later browser test fails.
      - name: Save publication compiler cache
        if: matrix.suite == 'site' && steps.publication-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules/.astro/publication/local/assets
            node_modules/.astro/publication/local/publication-social
            node_modules/.astro/publication/local/publication-diagrams
            node_modules/.astro/publication/local/publication-browser
          key: ${{ steps.publication-cache.outputs.cache-primary-key }}

      # One Playwright invocation reuses the synthetic release and database.
      # maxFailures still stops after the first persistent journey failure.
      - name: Run critical browser user journeys
        if: matrix.suite == 'site'
        timeout-minutes: 5
        run: pnpm run test:e2e:ci

      - name: Upload Playwright failure artifacts
        if: failure() && matrix.suite == 'site'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Worker and D1 integration tests
        if: matrix.suite == 'worker'
        # Include cold optimized publication setup and the complete integration suite.
        timeout-minutes: 60
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PKIC_TEST_PROFILE_PATH: ${{ runner.temp }}/worker-profile-${{ strategy.job-index }}.json
        run: pnpm run test:worker --bail=1 --shard=${{ matrix.shard }}

      - name: Upload Worker timing profile
        if: always() && matrix.suite == 'worker'
        uses: actions/upload-artifact@v4
        with:
          name: worker-profile-${{ strategy.job-index }}
          path: ${{ runner.temp }}/worker-profile-${{ strategy.job-index }}.json
          if-no-files-found: ignore
          retention-days: 7

  application:
    name: Application checks (fail-fast sequence)
    needs: validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
