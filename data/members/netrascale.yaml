content: |
  ## About NetraScale

  NetraScale develops cyber resilience and cryptographic risk intelligence platforms
  that help regulated organisations quantify their exposure to the quantum threat and
  build defensible PQC migration programmes.

  ### Products

  **QDayRisk** assesses an organisation's cryptographic posture across
  algorithm vulnerability, Harvest-Now-Decrypt-Later (HNDL) exposure,
  migration feasibility, and regulatory compliance — producing a structured
  CBOM aligned to OWASP CycloneDX 1.6 and mapped against 71 regulatory
  frameworks across 22 jurisdictions.

  **PQReady** issues verifiable PQC readiness certifications using a
  Two-Clocks methodology that scores Confidentiality (ML-KEM / FIPS 203
  readiness) and Trust/Authentication (ML-DSA / FIPS 204; SLH-DSA / FIPS 205
  readiness) as independently gated dimensions — reflecting the practitioner
  insight that these are genuinely different risk timelines requiring separate
  organisational responses.

  ### Standards Alignment

  - NIST FIPS 203 (ML-KEM), FIPS 204 (ML-DSA), FIPS 205 (SLH-DSA)
  - NSA CNSA 2.0 migration deadlines (2030–2033)
  - OWASP CycloneDX 1.6 CBOM
  - CCCS ITSM.40.001 (Canada, 2031 mandatory deadline)
  - EU CRA 2024/2847, EU DORA, NIS2
  - OSFI B-13, NCSC CAF v4.0, ISO/SAE 21434
  - OMB M-23-02 §2(c) SBOM/CBOM mandates

  ### Working Group Participation

  NetraScale participates in the **Post-Quantum Cryptography** and **CBOM
  Profiles** working groups, contributing practitioner experience from
  financial market infrastructure and critical infrastructure deployments
  to standards discussions on real-world PQC migration and cryptographic
  asset inventory practices.
