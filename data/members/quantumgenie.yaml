# Long-form content (markdown)
# Sources: https://quantumgenie.ai/ and https://aws.amazon.com/marketplace/pp/prodview-3v23v3rwhli54
# Relationship products: https://quantumgenie.ai/blog/cbom-causal-map-post-quantum-migration
# Featured video: https://www.youtube.com/watch?v=La3JG17G_Zs
content: |
  QuantumGenie helps organizations inventory cryptographic assets across source code, cloud infrastructure, certificates, keys, networks, and endpoints. CipherScan generates a Cryptographic Bill of Materials (CBOM) to support cryptographic risk assessment and migration planning.

  The Causal Security Engine attributes findings to applications, owners, and dependencies. CipherNova prepares remediation candidates and pull-request artifacts for engineering review, while CipherEdge provides endpoint monitoring and network visibility through packet capture and SPAN-port traffic.

  The Relationship Explorer and Security World Model connect cryptographic findings with applications, identities, and infrastructure to help teams assess dependencies and prioritize remediation.

