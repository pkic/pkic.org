    description: |
        I am currently pursuing my Master’s degree at BHT Berlin in Information and Communications Engineering, with a growing focus on cryptography and Post-Quantum Cryptography (PQC). I have around four years of professional experience as a software engineer, mainly working in full-stack development.

        Alongside my professional work, I have around one year of research experience, mainly focused on Post-Quantum Cryptography and its application to networking. I have already published one research paper in this area, and another paper is currently under review. My current research also continues to focus on PQC networking and the practical challenges of integrating post-quantum cryptography into modern communication systems.

