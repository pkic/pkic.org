content: |
  ## About Axidian

  Axidian is an identity security software vendor with its corporate center in Dubai, UAE, and branches in Lithuania and Singapore.

  ## Product portfolio

  [Axidian Access](https://axidian.com/axidian-access/) provides centralized identity and authentication management, multi-factor authentication, Enterprise Single Sign-On, Web Single Sign-On, and mobile authentication.

  [Axidian Privilege](https://axidian.com/axidian-privilege/) is a privileged access management platform for controlling privileged accounts, managing credentials, monitoring access to corporate resources, and recording privileged user sessions.

  [Axidian CertiFlow](https://axidian.com/axidian-certiflow/) provides centralized management of digital certificates and PKI tokens. It supports certificate lifecycle operations, smart card management, PKI monitoring, user self-service, and automation of certificate issuance, renewal, and revocation.

  [Axidian Shield](https://axidian.com/axidian-shield/) monitors user and service account activity to identify and respond to identity-related attacks.

  ## Industries and presence

  Axidian works with organizations in finance, telecommunications, manufacturing, retail, government, and transportation.
