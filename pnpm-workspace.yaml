allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.39.1'
  - '@cloudflare/workers-types@4.20260602.1'
  - '@typescript-eslint/eslint-plugin@8.60.1'
  - '@typescript-eslint/parser@8.60.1'
  - '@typescript-eslint/project-service@8.60.1'
  - '@typescript-eslint/scope-manager@8.60.1'
  - '@typescript-eslint/tsconfig-utils@8.60.1'
  - '@typescript-eslint/type-utils@8.60.1'
  - '@typescript-eslint/types@8.60.1'
  - '@typescript-eslint/typescript-estree@8.60.1'
  - '@typescript-eslint/utils@8.60.1'
  - '@typescript-eslint/visitor-keys@8.60.1'
  - miniflare@4.20260529.0
  - typescript-eslint@8.60.1
  - wrangler@4.96.0
  - ws@8.20.1
overrides:
  # The inspected Cloudflare entrypoint uses a remote browser binding, not the
  # Node browser installer. Omit its unused, unpatched extract-zip dependency chain.
  "@cloudflare/puppeteer@1.3.0>@puppeteer/browsers": "-"
  ws@>=8.0.0 <8.20.1: ^8.20.1
  "@hono/node-server@<1.19.15": 1.19.15
  "body-parser@>=2.0.0 <2.3.0": 2.3.0
  "brace-expansion@>=3.0.0 <5.0.9": 5.0.9
  esbuild: "^0.28.1"
  "fast-uri@>=3.0.0 <3.1.6": 3.1.6
  "ip-address@<=10.3.0": 10.3.1
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  "nanoid@>=4.0.0 <5.1.16": 5.1.16
  "postcss@<=8.5.22": 8.5.23
  "qs@>=2.2.5 <6.16.0": 6.16.0
  "sharp@<0.35.4": 0.35.4
  undici: "^7.29.0"
