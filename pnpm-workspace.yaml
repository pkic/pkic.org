allowBuilds:
  "@parcel/watcher": false
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  # Mermaid reuses Playwright's managed Chromium instead of downloading a second browser.
  puppeteer: false
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.39.1"
  - "@cloudflare/workers-types@4.20260602.1"
  - miniflare@4.20260529.0
  - wrangler@4.96.0
  - ws@8.20.1
  - "@cloudflare/vitest-plugin@1.4.3"
overrides:
  # The inspected Cloudflare entrypoint uses a remote browser binding, not the
  # Node browser installer. Omit its unused, unpatched extract-zip dependency chain.
  "@cloudflare/puppeteer@1.3.0>@puppeteer/browsers": "-"
