<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captured email · PKIC local rehearsal</title>
    <link rel="stylesheet" href="/inbox.css" />
    <script src="/inbox.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Captured email</h1>
      <p>Local rehearsal. Messages stay here and are never delivered to recipients.</p>
    </header>
    <main>
      <p id="status" role="status">Loading captured messages…</p>
      <button id="refresh" type="button">Refresh</button>
      <section id="messages" aria-label="Captured messages"></section>
    </main>
  </body>
</html>
